<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WM 2026 Spielplan</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.match{
    background:#1c1c1c;
    margin:10px auto;
    padding:15px;
    border-radius:10px;
    max-width:800px;
}

.date{
    color:#aaa;
    margin-bottom:8px;
}

.teams{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:bold;
}

.score{
    color:#ff4444;
}
</style>
</head>
<body>

<h1>🏆 FIFA WM 2026 – Spieltag 1</h1>

<div id="matches"></div>

<script>

fetch("https://api.openligadb.de/getmatchdata/wm26/2026/1")
.then(response => response.json())
.then(data => {

const container = document.getElementById("matches");

data.forEach(match => {

let home = match.Team1.TeamName;
let away = match.Team2.TeamName;

let score = "- : -";

if(match.MatchResults && match.MatchResults.length > 0){

let result = match.MatchResults[match.MatchResults.length - 1];

score = result.PointsTeam1 + " : " + result.PointsTeam2;
}

container.innerHTML += `
<div class="match">
<div class="date">${new Date(match.MatchDateTime).toLocaleString()}</div>
<div class="teams">
<span>${home}</span>
<span class="score">${score}</span>
<span>${away}</span>
</div>
</div>
`;

});

})
.catch(error => {
document.getElementById("matches").innerHTML =
"Fehler beim Laden der Daten.";
});

</script>

</body>
</html>
