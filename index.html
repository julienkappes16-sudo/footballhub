<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WM 2026 Spielplan</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

.match{
    background:#1c1c1c;
    margin:10px auto;
    padding:15px;
    border-radius:10px;
    max-width:800px;
}

.date{
    color:#aaa;
    margin-bottom:8px;
}

.teams{
    display:flex;
    justify-content:space-between;
    font-size:20px;
    font-weight:bold;
}

.score{
    color:#ff4444;
}
</style>
</head>
<body>

<h1>🏆 FIFA WM 2026 – Spieltag 1</h1>

<div id="matches"></div>

<script>

async function ladeSpiele() {
    try {
        const response = await fetch(
            "https://api.allorigins.win/raw?url=https://api.openligadb.de/getmatchdata/wm26/2026/1"
        );

        const spiele = await response.json();

        let html = "";

        spiele.forEach(spiel => {
            const heim = spiel.team1?.teamName || "-";
            const gast = spiel.team2?.teamName || "-";

            let ergebnis = "-";

            if (spiel.matchResults && spiel.matchResults.length > 0) {
                const endstand = spiel.matchResults[spiel.matchResults.length - 1];
                ergebnis = `${endstand.pointsTeam1}:${endstand.pointsTeam2}`;
            }

            html += `
                <div style="
                    background:#1c1c1c;
                    padding:15px;
                    margin:10px 0;
                    border-radius:8px;
                ">
                    <strong>${heim}</strong>
                    <span style="margin:0 10px;">vs</span>
                    <strong>${gast}</strong>
                    <br>
                    Ergebnis: ${ergebnis}
                </div>
            `;
        });

        document.getElementById("matches").innerHTML = html;

    } catch (error) {
        document.getElementById("matches").innerHTML =
            "Fehler beim Laden der Daten.";
        console.error(error);
    }
}

ladeSpiele();

</script>

</body>
</html>
