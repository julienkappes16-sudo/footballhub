<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FootballHub</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111;
color:white;
padding:20px;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:#1c1c1c;
}

th{
background:red;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #333;
}
</style>
</head>

<body>

<h1>⚽ Bundesliga Tabelle</h1>

<table>
<thead>
<tr>
<th>#</th>
<th>Team</th>
<th>Punkte</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

<script>

fetch("https://www.openligadb.de/api/getbltable/bl1")
.then(response => response.json())
.then(data => {

const body = document.getElementById("tableBody");

data.forEach(team => {

body.innerHTML += `
<tr>
<td>${team.Platz}</td>
<td>${team.TeamName}</td>
<td>${team.Punkte}</td>
</tr>
`;

});

});

</script>

</body>
</html>
